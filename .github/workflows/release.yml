name: Release

# Cada merge a main publica la app (lógica en scripts/release.sh):
#   - fingerprint nativo ya construido  → update OTA (llega solo al abrir la app)
#   - fingerprint nuevo (cambio nativo) → build APK en EAS + GitHub Release "build-<versionCode>"
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'auto = decide por fingerprint · build = forzar APK · update = forzar OTA'
        type: choice
        options: [auto, build, update]
        default: auto

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # la cola gratis de EAS puede tardar 90+ min
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Release
        run: scripts/release.sh "${{ inputs.mode || 'auto' }}"
